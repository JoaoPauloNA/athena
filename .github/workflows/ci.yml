name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: JoaoPauloNA/aegis
          ref: main
          path: .ci/aegis
          ssh-key: ${{ secrets.AEGIS_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install -e .ci/aegis
          pip install -e ".[dev]" --no-deps
          pip install import-linter pytest ruff

      - name: P0 gate
        run: python harness/p0_gate.py
        env:
          # Scan de CLIs no PATH é local demais para CI (e lento no Windows)
          ATHENA_SKIP_AUTODISCOVERY: "1"
