name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: P0 gate
        run: python harness/p0_gate.py
        env:
          # Scan de CLIs no PATH é local demais para CI (e lento no Windows)
          ATHENA_SKIP_AUTODISCOVERY: "1"

  moiras-contract:
    name: Athena × Moiras contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Athena
        uses: actions/checkout@v4
        with:
          path: athena

      - name: Checkout Moiras v0.1.1
        uses: actions/checkout@v4
        with:
          repository: JoaoPauloNA/moiras
          ref: v0.1.1
          path: moiras

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            athena/pyproject.toml
            moiras/pyproject.toml

      - name: Install both packages
        run: pip install -e "./athena[dev]" -e ./moiras

      - name: Ruff contract boundary
        working-directory: athena
        run: ruff check athena/moiras_adapter.py tests/test_moiras_adapter_integration.py --output-format=github

      - name: Real cross-repository tests
        working-directory: athena
        run: pytest -q tests/test_moiras_adapter.py tests/test_moiras_adapter_integration.py
        env:
          ATHENA_SKIP_AUTODISCOVERY: "1"
