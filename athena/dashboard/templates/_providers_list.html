{% if providers %}
  {% for p in providers %}
  <div class="provider-item {{ 'available' if p.available else 'unavailable' }}">
    <span>{{ '✅' if p.available else '❌' }}</span>
    <div style="flex: 1;">
      <strong>{{ p.name }}</strong>
      <small style="display: block; color: var(--muted-color);">{{ p.description }}</small>
      {% if p.available %}
        <small style="display: block;">
          <code>{{ p.path }}</code> |
          Default: <code>{{ p.recommended_default_model or 'auto' }}</code>
        </small>
      {% endif %}
    </div>
  </div>
  {% endfor %}
{% else %}
  <p>Nenhum provider configurado.</p>
{% endif %}
