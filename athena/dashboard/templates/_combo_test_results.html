{% if results %}
  <div style="margin-top: 0.5rem;">
    <strong>Resultados do teste:</strong>
    {% for r in results %}
      <div class="test-result {{ r.status }}">
        <span>{{ '✅' if r.status == 'ok' else '❌' }}</span>
        <strong>{{ r.provider_id }}</strong>
        {% if r.duration_s is defined %}<small>({{ r.duration_s }}s)</small>{% endif %}
        {% if r.error %}<br><small style="color: #ef4444;">{{ r.error }}</small>{% endif %}
      </div>
    {% endfor %}
  </div>
{% endif %}
