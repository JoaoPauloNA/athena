{% extends "base.html" %}

{% block title %}Novo Combo - Athena-MCP{% endblock %}

{% block content %}
<h1>🔀 Novo Combo</h1>

<article>
  <form hx-post="/hx/combos" hx-target="#result" hx-swap="innerHTML">
    <label>
      ID do combo
      <input type="text" name="combo_id" placeholder="ex: meu-combo" required pattern="[a-z0-9-]+">
      <small>Apenas letras minúsculas, números e hífens.</small>
    </label>

    <label>
      Nome
      <input type="text" name="name" placeholder="ex: Meu Combo" required>
    </label>

    <label>
      Descrição
      <input type="text" name="description" placeholder="Opcional">
    </label>

    <hr>
    <h4>🔗 Chain de Providers</h4>
    <p><small>Ordem de prioridade (primeiro → último fallback)</small></p>

    <div class="grid">
      <div>
        <label>
          Provider 1 (obrigatório)
          <select name="provider_1" required>
            <option value="">Selecione...</option>
            {% for p in providers %}
              {% if p.available %}
                <option value="{{ p.id }}">{{ p.name }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </label>
        <label>
          Modelo 1 (opcional)
          <input type="text" name="model_1" placeholder="auto">
        </label>
      </div>

      <div>
        <label>
          Provider 2 (fallback)
          <select name="provider_2">
            <option value="">Nenhum</option>
            {% for p in providers %}
              {% if p.available %}
                <option value="{{ p.id }}">{{ p.name }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </label>
        <label>
          Modelo 2 (opcional)
          <input type="text" name="model_2" placeholder="auto">
        </label>
      </div>

      <div>
        <label>
          Provider 3 (último fallback)
          <select name="provider_3">
            <option value="">Nenhum</option>
            {% for p in providers %}
              {% if p.available %}
                <option value="{{ p.id }}">{{ p.name }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </label>
        <label>
          Modelo 3 (opcional)
          <input type="text" name="model_3" placeholder="auto">
        </label>
      </div>
    </div>

    <footer>
      <button type="submit">✅ Criar Combo</button>
      <a href="/combos" role="button" class="secondary">Cancelar</a>
    </footer>
  </form>

  <div id="result"></div>
</article>
{% endblock %}
