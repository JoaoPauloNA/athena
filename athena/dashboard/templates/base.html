<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Athena-MCP{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>
  <style>
    :root { --primary: #6366f1; --primary-hover: #4f46e5; }
    .status-badge { font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 1rem; background: var(--primary); color: white; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .provider-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 0.5rem; background: var(--card-background-color); }
    .provider-item.available { border-left: 3px solid #22c55e; }
    .provider-item.unavailable { border-left: 3px solid #ef4444; opacity: 0.7; }
    .combo-item { padding: 0.75rem; border-radius: 0.5rem; background: var(--card-background-color); margin-bottom: 0.5rem; }
    .combo-chain { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .combo-step { background: var(--primary); color: white; padding: 0.2rem 0.5rem; border-radius: 0.3rem; font-size: 0.85rem; }
    .test-result { padding: 0.5rem; border-radius: 0.3rem; margin: 0.25rem 0; }
    .test-result.ok { background: rgba(34, 197, 94, 0.2); }
    .test-result.error { background: rgba(239, 68, 68, 0.2); }
    nav ul li a { text-decoration: none; }
    nav ul li a:hover { text-decoration: underline; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="container-fluid">
    <ul>
      <li><strong>🔱 Athena-MCP</strong></li>
    </ul>
    <ul>
      <li><a href="/">Dashboard</a></li>
      <li><a href="/providers">CLIs</a></li>
      <li><a href="/combos">Combos</a></li>
      <li><span hx-get="/hx/status" hx-trigger="every 30s" class="status-badge">🟢 Online</span></li>
    </ul>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="container">
    <small>Athena-MCP v{{ version }} | Dashboard: <code>http://localhost:20128</code></small>
  </footer>
</body>
</html>
