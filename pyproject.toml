[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-mcp"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["athena-aegis"]

[project.scripts]
athena-mcp = "athena.mcp_runtime:main"

[project.optional-dependencies]
dev = [
    "import-linter",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["athena", "athena.*"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: comparativo lento entre núcleo novo e legado, ~15 min, exige ollama local",
]

[tool.importlinter]
root_packages = ["athena"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core modules follow the allowed dependency layers and never import legado"
type = "layers"
layers = [
    "(legado)",
    "athena.mcp_server",
    "athena.verifier",
    "athena.router",
    "athena.bridge",
    "athena.registry | athena.lease | athena.profiles | athena.transport",
    "athena.execution",
]

[[tool.importlinter.contracts]]
name = "lease does not import execution or another core module"
type = "forbidden"
source_modules = ["athena.lease"]
forbidden_modules = ["athena.execution"]

[[tool.importlinter.contracts]]
name = "profiles does not import execution or another core module"
type = "forbidden"
source_modules = ["athena.profiles"]
forbidden_modules = ["athena.execution"]

[[tool.importlinter.contracts]]
name = "bridge imports only execution and lease from lower core layers"
type = "forbidden"
source_modules = ["athena.bridge"]
forbidden_modules = [
    "athena.profiles",
    "athena.registry",
    "athena.transport",
]

[[tool.importlinter.contracts]]
name = "router does not import closed lower-layer modules"
type = "forbidden"
source_modules = ["athena.router"]
forbidden_modules = [
    "athena.registry",
    "athena.transport",
]

[[tool.importlinter.contracts]]
name = "verifier imports only execution from lower core layers"
type = "forbidden"
source_modules = ["athena.verifier"]
forbidden_modules = [
    "athena.router",
    "athena.bridge",
    "athena.registry",
    "athena.lease",
    "athena.profiles",
    "athena.transport",
]

[[tool.importlinter.contracts]]
name = "mcp server does not bypass its allowed core dependencies"
type = "forbidden"
source_modules = ["athena.mcp_server"]
allow_indirect_imports = true
forbidden_modules = [
    "athena.bridge",
    "athena.lease",
    "athena.transport",
]

[[tool.importlinter.contracts]]
name = "closed core modules do not import aegis"
type = "forbidden"
source_modules = [
    "athena.execution",
    "athena.lease",
    "athena.registry",
    "athena.transport",
    "athena.bridge",
    "athena.verifier",
]
forbidden_modules = ["aegis"]
