[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-mcp"
version = "0.0.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "import-linter",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["athena", "athena.*"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["athena"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "execution imports no other core module or legado"
type = "forbidden"
source_modules = ["athena.execution"]
forbidden_modules = [
    "athena.bridge",
    "athena.lease",
    "athena.mcp_server",
    "athena.profiles",
    "athena.registry",
    "athena.router",
    "athena.transport",
    "athena.verifier",
    "legado",
]

[[tool.importlinter.contracts]]
name = "registry imports only execution from the core and never legado"
type = "forbidden"
source_modules = ["athena.registry"]
forbidden_modules = [
    "athena.bridge",
    "athena.lease",
    "athena.mcp_server",
    "athena.profiles",
    "athena.router",
    "athena.transport",
